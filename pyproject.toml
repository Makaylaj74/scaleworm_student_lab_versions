[project]
name = "scaleworm-student-lab"
version = "0.1.0"
description = "Human-in-the-loop scale worm detection lab — Axial Seamount CAMHD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10.0",
    "ipykernel>=6.25",
    "ultralytics>=8.4.131",
    "xarray>=2026.7.0",
    "netcdf4>=1.7.4",
    "plotly>=7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# scripts import each other by bare module name (e.g. `from eval_val_recall import ...`)
# and tests use `from scripts.X import ...`, so both dirs must be importable.
pythonpath = ["scripts", "."]
