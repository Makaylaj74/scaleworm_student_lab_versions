[project]
name = "scaleworm-student-lab"
version = "0.1.0"
description = "Human-in-the-loop scale worm detection lab — Axial Seamount CAMHD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10.0",
    "ipykernel>=6.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # statsmodels is used only by tests/test_irr_agreement.py to cross-check the
    # Fleiss' kappa implementation against a reference; it pulls scipy transitively.
    "statsmodels>=0.14",
]
